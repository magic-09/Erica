<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Study - 집중 공부 타이머</title>
  <style>
    :root {
      --bg-color: #FAFAFA;
      --card-bg: #FFFFFF;
      --primary: #FF8A50;
      --primary-light: #FFF4EC;
      --text-main: #2C2C2C;
      --text-sub: #757575;
      --border-color: #E0E0E0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 우측 상단 허용앱 설정 버튼 */
    .top-bar {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
    }

    .btn-settings {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: all 0.2s;
    }

    .btn-settings:hover {
      background-color: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 화면 중앙 타이머 영역 */
    .timer-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 48px 64px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .study-quote {
      font-size: 14px;
      color: var(--text-sub);
      background: var(--primary-light);
      padding: 8px 16px;
      border-radius: 20px;
      max-width: 320px;
      line-height: 1.4;
    }

    .timer-display {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFF;
      border: none;
      padding: 14px 36px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background-color: #F0F0F0;
      color: var(--text-main);
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 타이머 시작 시 잠금 화면 (오버레이) */
    .lock-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(250, 250, 250, 0.96);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lock-overlay.active {
      display: flex;
    }

    .lock-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
      width: 90%;
      max-width: 440px;
    }

    .allowed-apps-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-card.active {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .app-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .app-name {
      font-weight: 600;
      font-size: 14px;
    }

    .app-timer {
      font-size: 12px;
      color: var(--primary);
      font-weight: 700;
      margin-top: 2px;
    }

    .btn-app-action {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-app-action.stop {
      background-color: #E53935;
    }

    /* 설정 / 기록 모달 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      overflow: hidden;
      box-shadow: 0 16px 32px rgba(0,0,0,0.1);
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: #F9F9F9;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    .tab-content {
      padding: 24px;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-group input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
    }

    .app-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #F0F0F0;
    }

    .btn-delete {
      color: #E53935;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }

    .modal-footer {
      padding: 16px 24px;
      text-align: right;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- 우측 상단 허용앱 설정 버튼 -->
  <div class="top-bar">
    <button class="btn-settings" id="openSettingsBtn">허용앱 설정</button>
  </div>

  <!-- 화면 정중앙 타이머 -->
  <div class="timer-container">
    <div class="study-quote" id="aiQuote">"자신에 대한 믿음을 가지세요."</div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-controls">
      <button class="btn-primary" id="startBtn">공부 시작</button>
    </div>
  </div>

  <!-- 타이머 작동 중 잠금 오버레이 -->
  <div class="lock-overlay" id="lockOverlay">
    <div class="lock-content">
      <h2 style="font-size: 20px; margin-bottom: 8px;">🔒 집중 공부 중</h2>
      <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 24px;">시간이 계속 기록되고 있습니다.</p>
      
      <div class="timer-display" id="overlayTimerDisplay" style="font-size: 48px; margin-bottom: 24px;">00:00</div>
      
      <h3 style="font-size: 14px; text-align: left; color: var(--text-sub);">허용된 서비스 이용하기</h3>
      <div class="allowed-apps-list" id="lockAppList">
        <!-- 허용 앱 목록 동적 생성 -->
      </div>

      <button class="btn-secondary" id="stopBtn" style="margin-top: 24px; width: 100%;">공부 종료 및 기록 저장</button>
    </div>
  </div>

  <!-- 허용앱 설정 & 기록 모달 -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-tabs">
        <button class="tab-btn active" id="tabSettingsBtn">허용앱 설정</button>
        <button class="tab-btn" id="tabLogsBtn">허용앱 기록 확인</button>
      </div>

      <!-- 탭 1: 허용앱 설정 -->
      <div class="tab-content active" id="tabSettings">
        <div class="input-group">
          <input type="text" id="appNameInput" placeholder="허용할 앱/서비스 이름 (예: 노션, 사전)">
          <button class="btn-primary" id="addAppBtn" style="padding: 10px 16px;">추가</button>
        </div>
        <div id="settingsAppList">
          <!-- 목록 동적 생성 -->
        </div>
      </div>

      <!-- 탭 2: 허용앱 기록 확인 -->
      <div class="tab-content" id="tabLogs">
        <div id="logsList">
          <!-- 사용 기록 동적 생성 -->
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" id="closeModalBtn" style="padding: 8px 16px; font-size: 14px;">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // State 관리
    let allowedApps = JSON.parse(localStorage.getItem('allowedApps')) || ['노션 노트', '네이버 사전'];
    let usageLogs = JSON.parse(localStorage.getItem('usageLogs')) || [];
    
    let timerSeconds = 0; // 공부 타이머 (스톱워치)
    let timerInterval = null;
    let activeAppSession = null; // { name: '앱이름', durationSec: 0 }

    // DOM Elements
    const timerDisplay = document.getElementById('timerDisplay');
    const overlayTimerDisplay = document.getElementById('overlayTimerDisplay');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const lockOverlay = document.getElementById('lockOverlay');
    
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const tabSettingsBtn = document.getElementById('tabSettingsBtn');
    const tabLogsBtn = document.getElementById('tabLogsBtn');
    const tabSettings = document.getElementById('tabSettings');
    const tabLogs = document.getElementById('tabLogs');
    
    const appNameInput = document.getElementById('appNameInput');
    const addAppBtn = document.getElementById('addAppBtn');
    const settingsAppList = document.getElementById('settingsAppList');
    const lockAppList = document.getElementById('lockAppList');
    const logsList = document.getElementById('logsList');
    const aiQuote = document.getElementById('aiQuote');

    // Gemini API 호출을 통한 응원 문구 수신
    async function fetchAiQuote() {
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: '정독실/독서실 분위기에서 공부 집중을 독려하는 진중하고 짧은 명언 한 문장을 줘.' })
        });
        const data = await res.json();
        if (data.text) {
          aiQuote.innerText = `"${data.text.trim()}"`;
        }
      } catch (e) {
        console.error("AI 명언 불러오기 실패:", e);
      }
    }

    // 시간 포맷 (HH:MM:SS 또는 MM:SS)
    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;

      if (h > 0) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // 타이머 렌더링
    function updateDisplay() {
      const text = formatTime(timerSeconds);
      timerDisplay.innerText = text;
      overlayTimerDisplay.innerText = text;
    }

    // 타이머 시작 (0초부터 1초씩 증가)
    startBtn.addEventListener('click', () => {
      timerSeconds = 0;
      activeAppSession = null;
      updateDisplay();
      
      lockOverlay.classList.add('active');
      renderLockAppList();
      
      timerInterval = setInterval(() => {
        timerSeconds++;
        updateDisplay();

        // 현재 사용 중인 허용앱의 카운팅 진행
        if (activeAppSession) {
          activeAppSession.durationSec++;
          const liveTimerEl = document.getElementById(`app-timer-${activeAppSession.name}`);
          if (liveTimerEl) {
            liveTimerEl.innerText = formatTime(activeAppSession.durationSec);
          }
        }
      }, 1000);
    });

    // 타이머 종료
    stopBtn.addEventListener('click', () => {
      stopTimer();
    });

    function stopTimer() {
      clearInterval(timerInterval);
      lockOverlay.classList.remove('active');
      
      // 실행 중이던 허용앱이 있다면 자동 기록 저장
      if (activeAppSession) {
        saveAppUsageLog(activeAppSession);
        activeAppSession = null;
      }

      alert(`공부 완료! 총 ${formatTime(timerSeconds)} 동안 집중했습니다.`);
      
      timerSeconds = 0;
      updateDisplay();
    }

    // 허용앱 사용 기록 저장
    function saveAppUsageLog(session) {
      if (session.durationSec < 1) return;
      
      const logItem = {
        name: session.name,
        duration: session.durationSec,
        timestamp: new Date().toLocaleString('ko-KR')
      };
      usageLogs.unshift(logItem);
      localStorage.setItem('usageLogs', JSON.stringify(usageLogs));
    }

    // 허용앱 사용 시작
    window.startAppUsage = function(appName) {
      // 이미 다른 앱이 실행 중이었다면 기존 앱 사용 기록 저장
      if (activeAppSession) {
        saveAppUsageLog(activeAppSession);
      }

      activeAppSession = {
        name: appName,
        durationSec: 0
      };

      renderLockAppList();
    };

    // 허용앱 사용 중단
    window.stopAppUsage = function(appName) {
      if (activeAppSession && activeAppSession.name === appName) {
        saveAppUsageLog(activeAppSession);
        activeAppSession = null;
      }

      renderLockAppList();
    };

    // 잠금화면 허용앱 리스트 렌더링
    function renderLockAppList() {
      lockAppList.innerHTML = '';
      if (allowedApps.length === 0) {
        lockAppList.innerHTML = '<p style="font-size:13px; color:var(--text-sub);">등록된 허용앱이 없습니다.</p>';
        return;
      }
      
      allowedApps.forEach((app) => {
        const isRunning = activeAppSession && activeAppSession.name === app;
        const card = document.createElement('div');
        card.className = `app-card ${isRunning ? 'active' : ''}`;

        const timerText = isRunning ? formatTime(activeAppSession.durationSec) : '';

        card.innerHTML = `
          <div class="app-info">
            <span class="app-name">${app}</span>
            <span class="app-timer" id="app-timer-${app}">${timerText}</span>
          </div>
          ${
            isRunning
              ? `<button class="btn-app-action stop" onclick="stopAppUsage('${app}')">사용 중단</button>`
              : `<button class="btn-app-action" onclick="startAppUsage('${app}')">사용 시작</button>`
          }
        `;
        lockAppList.appendChild(card);
      });
    }

    // 허용앱 설정 모달 렌더링
    function renderSettingsList() {
      settingsAppList.innerHTML = '';
      allowedApps.forEach((app, index) => {
        const div = document.createElement('div');
        div.className = 'app-item';
        div.innerHTML = `
          <span>${app}</span>
          <button class="btn-delete" onclick="removeApp(${index})">삭제</button>
        `;
        settingsAppList.appendChild(div);
      });
    }

    // 앱 사용 기록 탭 렌더링
    function renderLogsList() {
      logsList.innerHTML = '';
      if (usageLogs.length === 0) {
        logsList.innerHTML = '<p style="font-size:13px; color:var(--text-sub); text-align:center;">아직 기록된 허용앱 사용 내역이 없습니다.</p>';
        return;
      }

      usageLogs.forEach(log => {
        const div = document.createElement('div');
        div.className = 'app-item';
        const formattedUsage = formatTime(log.duration);

        div.innerHTML = `
          <div>
            <div style="font-weight:600;">${log.name}</div>
            <div style="font-size:11px; color:var(--text-sub);">${log.timestamp}</div>
          </div>
          <span style="font-weight:600; color:var(--primary);">${formattedUsage}</span>
        `;
        logsList.appendChild(div);
      });
    }

    // 허용앱 추가 / 삭제
    addAppBtn.addEventListener('click', () => {
      const name = appNameInput.value.trim();
      if (name) {
        allowedApps.push(name);
        localStorage.setItem('allowedApps', JSON.stringify(allowedApps));
        appNameInput.value = '';
        renderSettingsList();
      }
    });

    window.removeApp = function(index) {
      allowedApps.splice(index, 1);
      localStorage.setItem('allowedApps', JSON.stringify(allowedApps));
      renderSettingsList();
    };

    // 모달 관리 & 탭 전환
    openSettingsBtn.addEventListener('click', () => {
      modalBackdrop.classList.add('active');
      renderSettingsList();
    });

    closeModalBtn.addEventListener('click', () => {
      modalBackdrop.classList.remove('active');
    });

    tabSettingsBtn.addEventListener('click', () => {
      tabSettingsBtn.classList.add('active');
      tabLogsBtn.classList.remove('active');
      tabSettings.classList.add('active');
      tabLogs.classList.remove('active');
      renderSettingsList();
    });

    tabLogsBtn.addEventListener('click', () => {
      tabLogsBtn.classList.add('active');
      tabSettingsBtn.classList.remove('active');
      tabLogs.classList.add('active');
      tabSettings.classList.remove('active');
      renderLogsList();
    });

    // 초기화
    updateDisplay();
    fetchAiQuote();
  </script>
</body>
</html>
